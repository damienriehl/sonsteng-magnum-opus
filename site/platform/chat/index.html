<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Client Interview — Sonsteng Practicum</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f4efe4'/%3E%3Crect y='1' width='16' height='2' fill='%23a9822f'/%3E%3Crect y='12' width='16' height='1' fill='%23a9822f'/%3E%3Crect x='2' y='6' width='3' height='4' fill='%237c1e2b'/%3E%3C/svg%3E">

<!--
  Content-Security-Policy (strict, static-safe).
  - default-src 'none'        : deny everything not explicitly allowed.
  - script-src 'self'         : REQUIRED so chat.js loads; no inline script anywhere
                                (the enumerated contract omitted script-src, but a JS app
                                 cannot run under default-src 'none' — this is the strict,
                                 same-origin-only reading of the intent: external files only,
                                 zero inline execution).
  - style-src 'self' 'unsafe-inline' : theme.css + the chat.js-injected <style> block.
  - font-src 'self' data:     : embedded OFL woff2 + data-URI grain.
  - connect-src *             : API_BASE is resolved at RUNTIME (?api= / localStorage /
                                 <meta> / same-origin '/api') so the fetch origin is not
                                 knowable when this static file is authored — a single
                                 hard-coded origin would break BYOK deploy-your-own-Worker.
                                 The Worker itself enforces a CORS allowlist; this is the
                                 client half only.
  - img-src 'self' data:      : local + data-URI only.
  - base-uri 'none'; form-action 'none' : hardening (no <base> hijack, no form posts).
  - script-src / frame-src add challenges.cloudflare.com : the Turnstile bot-gate
    (WP6) loads its api.js and renders its challenge in a same-origin-parented
    iframe from challenges.cloudflare.com. connect-src '*' already covers its XHR.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src *; img-src 'self' data:; frame-src https://challenges.cloudflare.com; base-uri 'none'; form-action 'none'">

<!-- API base override (lowest precedence after '/api'); leave content empty by default. -->
<meta name="sonsteng-api" content="https://sonsteng-chat.damienriehl.workers.dev">

<!-- Turnstile sitekey (PUBLIC) for the session-mint bot-gate. chat.js reads this
     to render the managed widget. One widget covers DEV + PROD hostnames, so the
     same sitekey works in both environments. -->
<meta name="turnstile-sitekey" content="0x4AAAAAAD4uPMN8eNwzYvAy">

<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">

<!-- shared assets: the generator copies app/chat/ -> site/platform/chat/, where ../assets resolves. -->
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/theme.css">
</head>
<body>
  <!-- chat.js builds the entire consultation room into this root (createElement/textContent only). -->
  <div id="chat-root" data-mode="live"></div>
  <noscript>
    <div class="wrap">
      <div class="stage-direction">This client interview needs JavaScript enabled to run.</div>
    </div>
  </noscript>
  <!-- Turnstile bot-gate: explicit render so chat.js controls the widget and
       reads its token before minting a session. onload fires window.
       onloadTurnstileCallback (defined in chat.js). async+defer: non-blocking. -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onloadTurnstileCallback&render=explicit" async defer></script>
  <script src="byok.js"></script>
  <script src="chat.js"></script>
</body>
</html>
