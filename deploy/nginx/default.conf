# Cloudflare Pages redirects explicit .html requests to clean URLs; DEV
# deliberately serves both forms without adding that redirect behavior.
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    autoindex off;
    server_tokens off;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
